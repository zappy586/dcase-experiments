[project]
name = "dcase-experiments"
version = "0.1.0"
description = "Anomalous sound detection experiments on DCASE data"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "tqdm>=4.70.1",
    "torch",
    "torchaudio",
    "numpy",
    "scikit-learn",
    "matplotlib",
    "soundfile",
    "pyyaml",
    "encodec>=0.1.1",
    "timm>=1.0.30",
    "safetensors>=0.8.0",
    "transformers>=5.20.2",
    "omegaconf>=2.4.0",
    "bitsandbytes>=0.50.2",
    "accelerate>=1.15.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
